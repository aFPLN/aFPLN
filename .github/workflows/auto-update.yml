name: FPLN dependency auto-update
# Prepares a library bump when the vaccine list requires a newer version, and opens a pull request
# for the owner to review and merge. It NEVER deploys and never pushes to main or gh-pages on its own:
# the owner approves every update. Auto-secure (layer 11) keeps the affected feature contained in the
# meantime. Runs weekly after the vaccine, whenever the vaccine edits threats.json, and by hand
# (Actions > FPLN dependency auto-update > Run workflow).
on:
  push:
    branches: [main]
    paths: [".github/safety/threats.json", ".github/safety/vendor_sources.json"]
  schedule:
    - cron: "27 14 * * 1"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: fpln-auto-update
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Plan (dry run)
        id: plan
        run: |
          python .github/safety/autoupdate.py --root . --out "$RUNNER_TEMP/plan.json"
          changed=$(python -c "import json;print('yes' if [p for p in json.load(open('$RUNNER_TEMP/plan.json'))['plans'] if 'skip' not in p] else 'no')")
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "### FPLN dependency auto-update" >> "$GITHUB_STEP_SUMMARY"

      - name: Nothing to do
        if: steps.plan.outputs.changed != 'yes'
        run: echo "Every vendored library already meets the vaccine list. No pull request needed." >> "$GITHUB_STEP_SUMMARY"

      - name: Install browser
        if: steps.plan.outputs.changed == 'yes'
        run: |
          pip install playwright==1.48.0
          python -m playwright install --with-deps chromium

      - name: Apply bump (download + pin + rewrite refs)
        if: steps.plan.outputs.changed == 'yes'
        run: python .github/safety/autoupdate.py --root . --apply --out "$RUNNER_TEMP/autoupdate.json"

      - name: T0 release scan
        if: steps.plan.outputs.changed == 'yes'
        id: t0
        run: |
          if python .github/safety/guard.py --root . && python .github/safety/vendor.py --root . --verify; then
            echo "pass=yes" >> "$GITHUB_OUTPUT"
          else
            echo "pass=no" >> "$GITHUB_OUTPUT"
          fi

      - name: T1 threat watch
        if: steps.plan.outputs.changed == 'yes'
        run: python .github/safety/threatwatch.py --root . --out "$RUNNER_TEMP/threatwatch.json" || true

      - name: T2 built-in test
        if: steps.plan.outputs.changed == 'yes'
        run: python .github/safety/selftest.py --root . --out "$RUNNER_TEMP/bit.json" || true

      - name: Summarize and open pull request
        if: steps.plan.outputs.changed == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
          T0_PASS: ${{ steps.t0.outputs.pass }}
        run: |
          python - <<'PY' > "$RUNNER_TEMP/body.md"
          import json, os
          t = os.environ["RUNNER_TEMP"]
          plan = json.load(open(t + "/plan.json"))
          lines = ["Automated dependency bump prepared by the FPLN auto-update workflow.",
                   "Review and merge to deploy; nothing is pushed to the live site on its own.", "",
                   "## Updates"]
          for p in plan["plans"]:
              if "skip" in p:
                  lines.append("- SKIPPED **%s** %s -> %s (%s)" % (p["name"], p["from"], p["to"], p["skip"]))
              else:
                  lines.append("- **%s** %s -> %s (%s)" % (p["name"], p["from"], p["to"], ", ".join(p["ids"])))
          def line(path, fmt):
              try: r = json.load(open(t + "/" + path))
              except Exception: return "- (did not finish)"
              return fmt(r)
          lines += ["", "## Checks",
                    "- T0 release scan + vendor hashes: %s" % ("PASS" if os.environ.get("T0_PASS") == "yes" else "**FAIL**"),
                    "- T1 threat watch: " + line("threatwatch.json", lambda r: "%s (%s)" % (r.get("result"), (r.get("summary") or {}))),
                    "- T2 built-in test: " + line("bit.json", lambda r: "%s (%d/%d)" % (r.get("result"), r.get("passed", 0), r.get("total", 0)))]
          lines += ["", "_T3 red team and T6 adversary run on their own weekly schedule._", "",
                    "---", "_Prepared by the FPLN dependency auto-update workflow._"]
          print("\n".join(lines))
          PY
          cat "$RUNNER_TEMP/body.md" >> "$GITHUB_STEP_SUMMARY"

          if [ "$T0_PASS" != "yes" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**T0 failed, so no pull request was opened.** The bump left the release scan red; please inspect the run." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          branch="auto-update/deps-$(date -u '+%Y%m%d-%H%M%S')"
          git config user.name "FPLN auto-update"
          git config user.email "fpln-auto-update@users.noreply.github.com"
          git checkout -b "$branch"
          git add .github/safety/vendor_sources.json vendor index.html
          title="Auto-update: $(python -c "import json;p=json.load(open('$RUNNER_TEMP/plan.json'));print(', '.join('%s %s->%s'%(x['name'],x['from'],x['to']) for x in p['plans'] if 'skip' not in x))")"
          git commit -m "$title"
          git push origin "$branch"

          if gh pr create --base main --head "$branch" --title "$title" --body-file "$RUNNER_TEMP/body.md"; then
            echo "" >> "$GITHUB_STEP_SUMMARY"; echo "Pull request opened for review." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Could not open the PR automatically (repo setting may block Actions from creating PRs)." >> "$GITHUB_STEP_SUMMARY"
            echo "Open it here: ${{ github.server_url }}/${{ github.repository }}/compare/main...$branch?expand=1" >> "$GITHUB_STEP_SUMMARY"
          fi
