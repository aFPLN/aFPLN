name: FPLN vendor libraries
# Downloads the libraries FPLN serves from its own site, checks them, pins their hashes, and commits them.
# Run by hand when a library needs updating (Actions > FPLN vendor libraries > Run workflow).
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Download and pin
        run: python3 .github/safety/vendor.py --root .
      - name: Verify and commit
        run: |
          python3 .github/safety/vendor.py --root . --verify
          git config user.name "FPLN vendor"
          git config user.email "fpln-vendor@users.noreply.github.com"
          git add vendor
          git commit -m "Vendor libraries: $(python3 -c "import json;m=json.load(open('vendor/manifest.json'));print(', '.join(v['name']+' '+v['version'] for v in m['files'].values()))")" || echo "No change"
          git push origin HEAD:main
