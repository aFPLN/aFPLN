name: FPLN control
# The owner's remote control for every copy of FPLN. Run it from github.com or the GitHub mobile app:
# Actions > FPLN control > Run workflow. It changes the safety signal on the live site within about a minute.
#   freeze         pause FPLN: nothing leaves any device, data kept, reminders off
#   erase          shut down and erase FPLN's data on every device that checks in (type ERASE in confirm)
#   restore        end a freeze or erase
#   switches       turn off features (comma list in "off"): eric, feedback, weather, canvas, fonts, libs, links; "none" = all on
#   banner         show a message at the top of FPLN for everyone; clear-banner removes it
#   uod            post the uniform of the day: put it in message, e.g. "ACU under Level 5 with black gloves" (date optional)
#   clear-uod      remove that day's posted uniform
#   autosecure-on / autosecure-off      let the 6-hourly auto-secure run change defenses, or stop it
#   device-auto-on / device-auto-off    let each device raise its own guard when it sees an attack, or stop that
#   device-reset   drop every device's auto-secure level back to normal
#   shutdown-site  replace the live site with the shutdown page; also erases old FPLN versions (type SHUTDOWN in confirm)
#   bring-back     put the full app back on the live site and restore it
on:
  workflow_dispatch:
    inputs:
      action:
        description: "What to do"
        required: true
        type: choice
        options: [freeze, erase, restore, switches, banner, clear-banner, uod, clear-uod, autosecure-on, autosecure-off, device-auto-on, device-auto-off, device-reset, shutdown-site, bring-back]
      message:
        description: "Message cadets see (freeze, erase, banner), or the uniform for uod"
        required: false
        default: ""
      off:
        description: "switches only: features to turn off, comma separated, or none"
        required: false
        default: ""
      date:
        description: "uod and clear-uod only: day as YYYY-MM-DD (blank = today, New York)"
        required: false
        default: ""
      group:
        description: "Test group code (24 characters) to send this only to that group's devices; leave blank for everyone"
        required: false
        default: ""
      confirm:
        description: "Type ERASE for erase, SHUTDOWN for shutdown-site"
        required: false
        default: ""
permissions:
  contents: write
concurrency:
  group: fpln-control
  cancel-in-progress: false
jobs:
  signal:
    runs-on: ubuntu-latest
    env:
      ACTION: ${{ inputs.action }}
      MSG: ${{ inputs.message }}
      OFF: ${{ inputs.off }}
      CONFIRM: ${{ inputs.confirm }}
      GROUP: ${{ inputs.group }}
      UDATE: ${{ inputs.date }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Check confirmation
        run: |
          if [ -n "$GROUP" ] && { [ "$ACTION" = "shutdown-site" ] || [ "$ACTION" = "bring-back" ] || [ "${ACTION#autosecure}" != "$ACTION" ] || [ "${ACTION#device-}" != "$ACTION" ]; }; then echo "::error::This action can't target a test group."; exit 1; fi
          if [ "$ACTION" = "erase" ] && [ -z "$GROUP" ] && [ "$CONFIRM" != "ERASE" ]; then echo "::error::Type ERASE in confirm to erase."; exit 1; fi
          if [ "$ACTION" = "shutdown-site" ] && [ "$CONFIRM" != "SHUTDOWN" ]; then echo "::error::Type SHUTDOWN in confirm to replace the site."; exit 1; fi
      - name: Write the signal
        run: |
          R=""; if [ -n "$GROUP" ]; then R="--ring $GROUP"; fi
          case "$ACTION" in
            freeze|erase) python3 .github/safety/control.py "$ACTION" --msg "$MSG" --by workflow $R ;;
            uod) python3 .github/safety/control.py uod --text "$MSG" ${UDATE:+--date "$UDATE"} --by workflow $R ;;
            clear-uod) python3 .github/safety/control.py clear-uod ${UDATE:+--date "$UDATE"} --by workflow $R ;;
            restore|bring-back) python3 .github/safety/control.py restore --by workflow $R ;;
            switches) python3 .github/safety/control.py switches --off "$OFF" --by workflow $R ;;
            banner) python3 .github/safety/control.py banner --msg "$MSG" --by workflow $R ;;
            clear-banner) python3 .github/safety/control.py clear-banner --by workflow $R ;;
            autosecure-on) python3 .github/safety/autosecure.py set --enabled on --root . ;;
            autosecure-off) python3 .github/safety/autosecure.py set --enabled off --root . ;;
            device-auto-on) python3 .github/safety/autosecure.py set --device on --root . ;;
            device-auto-off) python3 .github/safety/autosecure.py set --device off --root . ;;
            device-reset) python3 .github/safety/autosecure.py set --reset-devices --root . ;;
            shutdown-site) python3 .github/safety/control.py erase --msg "$MSG" --by workflow ;;
          esac
          python3 .github/safety/control.py status
      - name: Publish to main and the live site
        run: |
          git config user.name "FPLN control"
          git config user.email "fpln-control@users.noreply.github.com"
          git add control.json version.json .github/safety/autosecure.json
          git commit -m "FPLN control: $ACTION" || echo "Signal unchanged"
          git push origin HEAD:main
          if [ "$ACTION" = "shutdown-site" ]; then
            rm -rf /tmp/site && mkdir -p /tmp/site
            cp .github/safety/tombstone/index.html .github/safety/tombstone/sw.js control.json version.json /tmp/site/
            cp -r icons /tmp/site/ && touch /tmp/site/.nojekyll
            cd /tmp/site && git init -q -b gh-pages && git add -A
            git -c user.name="FPLN control" -c user.email="fpln-control@users.noreply.github.com" commit -qm "FPLN shut down"
            git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
          else
            git push -f origin HEAD:gh-pages
          fi
      - name: Summary
        run: |
          {
            echo "### FPLN control: $ACTION"
            echo "Done $(date -u '+%d %b %Y %H:%M UTC'). Devices pick it up the next time FPLN opens or within 5 minutes while open."
            echo '```json'; cat control.json; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
