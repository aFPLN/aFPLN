name: FPLN download machine
# Rebuilds kit/FPLN-kit.zip whenever the installer, banners or share files change.
on:
  push:
    branches: [main]
    paths: ["share/**", "download/**", ".github/kit/**"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fpln-pages-publish
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build the kit
        run: python3 .github/kit/build_kit.py
      - name: Safety scan
        run: python3 .github/safety/guard.py --root .
      - name: Publish if changed
        run: |
          git add kit/
          if git diff --cached --quiet; then echo "Kit already up to date"; exit 0; fi
          git -c user.name="FPLN kit" -c user.email="fpln-kit@users.noreply.github.com" commit -m "Download machine: rebuild FPLN kit"
          git pull --rebase origin main
          git push origin HEAD:main
          git push -f origin HEAD:gh-pages
