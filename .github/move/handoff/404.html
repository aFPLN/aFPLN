<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'">
<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex">
<title>FPLN has moved</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#060b14;color:#eef4fa;font:16px/1.5 system-ui,sans-serif;padding:20px;text-align:center}a{color:#8fd6ff}</style>
</head><body><p>FPLN has moved to <a id="a" href="__NEW__">its new address</a>.</p>
<script>
/* old links (/FPLN-/get, /FPLN-/share/, /FPLN-/download/ …) keep their place at the new address */
(function(){ var NEW = "__NEW__", p = location.pathname;
  var rest = /^\/FPLN-(\/|$)/.test(p) ? p.replace(/^\/FPLN-\/?/, "") : "";
  var to = NEW + rest + location.search + location.hash; document.getElementById("a").href = to; location.replace(to); })();
</script></body></html>
